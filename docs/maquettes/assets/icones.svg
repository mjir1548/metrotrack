     puis <svg class="ic" aria-hidden="true"><use href="#i-recherche"/></svg>.
     Dans le produit (CSP stricte) : remplacer style="display:none" par une classe CSS,
     et retirer xmlns (inutile en SVG intégré au HTML). Icônes ajoutées par les maquettes :
     i-supprimer / i-corbeille (corbeille), i-associer (maillon) — à reprendre ici à l'étape U1. -->
